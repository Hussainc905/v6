plugins { id 'com.android.application' }

android {
    namespace 'com.elyastech.elyasfun'
    compileSdk 35
    defaultConfig {
        applicationId 'com.elyastech.elyasfun'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '4.0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
